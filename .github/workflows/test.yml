name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and standalone script checks
        run: |
          python3 -m unittest discover -s tests -v
          bash brook-pf.sh --help
          printf '99\n' | bash brook-pf.sh menu
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, rocky]
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable systemd environment
        run: docker build -t brook-pf-test -f tests/Dockerfile.${{ matrix.distro }} .
      - name: Fetch official release metadata with CI authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/brook-pf-fixtures"
          gh api repos/txthinking/brook/releases/latest > "$RUNNER_TEMP/brook-pf-fixtures/release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import brook_pf as m
          directory = Path(os.environ["RUNNER_TEMP"]) / "brook-pf-fixtures"
          metadata = json.loads((directory / "release.json").read_text(encoding="utf-8"))
          _, url, digest = m.release_asset(metadata, m.architecture())
          m.fetch(url, directory / "brook")
          m.verify_binary(directory / "brook", digest)
          PY
      - name: Start systemd
        run: |
          docker run -d --name brook-pf-ci --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/brook-pf-fixtures:/fixtures:ro" -w /src brook-pf-test
          for attempt in $(seq 1 30); do
            if docker exec brook-pf-ci systemctl is-active --quiet systemd-tmpfiles-setup.service; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify release, TCP/UDP, IPv6, migration and rollback
        run: |
          docker exec -e BROOK_PF_INTEGRATION=1 \
            -e BROOK_PF_TEST_BINARY=/fixtures/brook \
            -e BROOK_PF_TEST_RELEASE=/fixtures/release.json \
            brook-pf-ci python3 tests/integration.py
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker exec brook-pf-ci journalctl -u brook-pf --no-pager || true
          docker rm -f brook-pf-ci || true
